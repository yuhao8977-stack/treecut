name: Test & Lint

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff
        continue-on-error: true

      - name: Lint with ruff
        run: ruff check core/ utils/ --ignore=E501,E402,F401,F841 --exit-zero

      - name: Compile check all Python files
        run: |
          python -c "
          import py_compile, os
          ok = fail = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if not d.startswith(('backup','.','__pycache__','models','shipin'))]
              for f in files:
                  if f.endswith('.py'):
                      try:
                          py_compile.compile(os.path.join(root, f), doraise=True)
                          ok += 1
                      except py_compile.PyCompileError as e:
                          print(f'FAIL: {os.path.join(root, f)} — {e}')
                          fail += 1
          print(f'Compile: {ok} OK, {fail} FAIL')
          assert fail == 0, f'{fail} files failed to compile'
          "

      - name: Run tests
        run: pytest tests/ --tb=short --timeout=30 -x || echo "Tests completed (some may skip without models)"

  build-check:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Verify build scripts
        run: |
          python -c "import py_compile; py_compile.compile('build_exe.py', doraise=True); print('build_exe.py OK')"
          python -c "import py_compile; py_compile.compile('add_script_table.py', doraise=True); print('add_script_table.py OK')"
